[[rule]]
toolName = "run_shell_command"
# Expanded to include push, merge, and remote for full PR/Branch lifecycle management.
commandRegex = "^git\\s+(status|branch|log|diff|checkout|add|commit|pull|fetch|rev-parse|describe|push|merge|remote)(\\s+.*)?$"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Expanded for full project orchestration, CI monitoring, and release management.
commandPrefix = ["gh issue", "gh pr", "gh api", "gh run", "gh label", "gh release"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# MANDATORY: Allows podman commands which are required by the Pharos Zero-Host constraint (ADR-0014).
commandPrefix = ["podman build", "podman run"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Authorize primary package manager operations for vertical slice verification.
commandPrefix = ["npm install", "npm test", "npm run", "npx vitest", "npx astro"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Authorize targeted cleanup of build artifacts to prevent "Ghost Artifact" pollutions.
commandRegex = "^rm\\s+-rf\\s+(\\.artifacts/|dist/|node_modules/|target/)(.*)?$"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Security: Allows hash verification as required by the Supply Chain Security logic (Issue #54).
commandPrefix = ["sha256sum"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Allow safe, read-only discovery tools to reduce "Research" turn count.
commandPrefix = ["ls", "cat", "grep", "find", "tail", "head", "sleep", "jq"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Authorize the project's primary validation and pulse-check scripts.
commandPrefix = ["scripts/pulse.sh", "scripts/truth-engine/pulse.ts", "scripts/podman-wrapper.sh"]
decision = "allow"
priority = 100
