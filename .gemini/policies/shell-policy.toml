[[rule]]
toolName = "run_shell_command"
# Expanded to allow chained git commands (&&) and advanced workflow tools (stash, show).
commandPrefix = ["git status", "git branch", "git log", "git diff", "git checkout", "git add", "git commit", "git pull", "git push", "git fetch", "git rev-parse", "git merge", "git remote", "git describe", "git show", "git stash", "git restore"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Expanded for full project orchestration, CI monitoring, and release management.
commandPrefix = ["gh issue", "gh pr", "gh api", "gh run", "gh label", "gh release"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# MANDATORY: Allows podman commands which are required by the Pharos Zero-Host constraint (ADR-0014).
commandPrefix = ["podman build", "podman run"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Authorize primary package manager operations for vertical slice verification.
commandPrefix = ["npm install", "npm ci", "npm uninstall", "npm test", "npm run", "npx vitest", "npx astro"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Authorize read-only cargo metadata queries for research efficiency.
commandPrefix = ["cargo check", "cargo metadata", "cargo tree"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Authorize targeted cleanup of build artifacts to prevent "Ghost Artifact" pollutions.
# Anchored to specific folders to prevent catastrophic deletions.
commandRegex = "^rm\\s+-rf\\s+(\\.artifacts/|dist/|node_modules/|target/)(.*)?$"
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Authorize surgical deletion of individual files to support cleanup after refactoring.
commandRegex = "^rm\\s+([\\w\\d\\./_-]+)$"
decision = "allow"
priority = 90

[[rule]]
toolName = "run_shell_command"
# Infrastructure: Authorize directory creation for staging and diagnostics.
commandPrefix = ["mkdir -p"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Security: Allows hash verification as required by the Supply Chain Security logic (Issue #54).
commandPrefix = ["sha256sum"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Allow safe, read-only discovery tools to reduce "Research" turn count.
commandPrefix = ["ls", "cat", "grep", "find", "tail", "head", "sleep", "jq", "date", "whoami"]
decision = "allow"
priority = 100

[[rule]]
toolName = "run_shell_command"
# Authorize the project's orchestration and validation scripts, including bash/sh execution.
commandRegex = "^(\\./|bash\\s+|sh\\s+)?scripts/.*\\.(sh|ts|ps1)(\\s+.*)?$"
decision = "allow"
priority = 100
