name = "auth-bridge"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
route = "iamrichardd.com/pharos-kitchen-design/api/auth/*"

[vars]
VERIFICATION_URI = "https://iamrichardd.com/pharos-kitchen-design/verify"
RP_ID = "iamrichardd.com"
EXPECTED_ORIGIN = "https://iamrichardd.com"

[[d1_databases]]
binding = "DB"
database_name = "pkd-prism-auth"
database_id = "0d9569ba-f1f4-4b37-b653-f3043b000cdb"
