[package]
name = "pkd-core"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Pharos Kitchen Design (Project Prism) - High-performance Rust/WASM engine for BIM interoperability."
license.workspace = true
repository.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
thiserror = "1.0"
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
hex = "0.4"
pharos-protocol = { path = "../pharos-protocol" }
once_cell = "1.18"
anyhow = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = "=16.0"
rayon = "1.8"
tokio = { version = "1.36", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
dashmap = { version = "5.5", features = ["serde", "rayon"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dashmap = { version = "5.5", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
wat = "1.211.0"
