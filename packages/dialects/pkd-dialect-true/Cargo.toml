# Purpose: WASM-based manufacturer dialect for True Manufacturing (KCL Discovery).
# Traceability: Issue #62
# ========================================================================

[package]
name = "pkd-dialect-true"
version = "0.1.0"
edition = "2021"
authors = ["Richard D. (https://github.com/iamrichardd)"]
license = "FSL-1.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pharos-protocol = { path = "../../pharos-protocol" }
thiserror = "1.0"
regex = "1.10"
base64 = "0.22"
anyhow = "1.0"
