# ========================================================================
# Project: Pharos Kitchen Design (Project Prism)
# Component: Dialect / Template
# File: Cargo.toml
# Author: Richard D. (https://github.com/iamrichardd)
# License: FSL-1.1 (See LICENSE file for details)
# Purpose: Template for WASM-based manufacturer dialects using Extism PDK.
# Traceability: Issue #60
# ========================================================================

[package]
name = "pkd-dialect-template"
version = "0.1.0"
edition = "2021"
authors = ["Richard D. (https://github.com/iamrichardd)"]
license = "FSL-1.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pharos-protocol = { path = "../../pharos-protocol" }
thiserror = "1.0"
regex = "1.10"
