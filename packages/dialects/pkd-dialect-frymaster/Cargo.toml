[package]
name = "pkd-dialect-frymaster"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pharos-protocol = { path = "../../pharos-protocol" }
thiserror = "1.0"
regex = "1.10"
once_cell = "1.18"
