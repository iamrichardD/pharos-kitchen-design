<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');
    :root {
      --bg: #0B0E14;
      --accent: #00BFFF;
      --text: #F0F4F8;
      --secondary: #1A1F26;
      --success: #10B981;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FFFFFF;
        --accent: #0F172A;
        --text: #0F172A;
        --secondary: #F1F5F9;
        --success: #059669;
      }
    }
    text { font-family: 'Inter', sans-serif; fill: var(--text); }
    .label { font-size: 18px; fill: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .value { font-size: 54px; font-weight: 700; }
    .desc { font-size: 16px; opacity: 0.8; }
    .metadata { font-size: 12px; font-weight: 700; opacity: 0.4; text-transform: uppercase; letter-spacing: 2px; }
    .glow { filter: drop-shadow(0 0 8px var(--accent)); }
  </style>

  <!-- Background -->
  <rect width="1200" height="500" fill="var(--bg)" />
  
  <!-- Metadata Label (Top Right) -->
  <text x="1140" y="45" text-anchor="end" class="metadata">Authoritative Record // Sprint 4.11</text>

  <!-- Security Shard (Left) -->
  <rect x="60" y="80" width="340" height="260" rx="12" fill="var(--secondary)" />
  <circle cx="230" cy="150" r="45" stroke="var(--accent)" stroke-width="2" fill="none" class="glow" />
  <path d="M230 120 L230 180 M200 150 L260 150" stroke="var(--accent)" stroke-width="4" fill="none" />
  <text x="230" y="240" text-anchor="middle" class="label">Supply Chain</text>
  <text x="230" y="290" text-anchor="middle" class="value">100%</text>
  <text x="230" y="315" text-anchor="middle" class="desc">SHA-256 Immutable Pinning</text>

  <!-- Performance Shard (Center) -->
  <rect x="430" y="80" width="340" height="260" rx="12" fill="var(--secondary)" />
  <path d="M480 220 Q600 120 720 220" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" fill="none" class="glow" />
  <circle cx="510" cy="190" r="8" fill="var(--success)" />
  <text x="600" y="240" text-anchor="middle" class="label">FFI Memory</text>
  <text x="600" y="290" text-anchor="middle" class="value">70%</text>
  <text x="600" y="315" text-anchor="middle" class="desc">Direct Span Reduction</text>

  <!-- DORA Shard (Right) -->
  <rect x="800" y="80" width="340" height="260" rx="12" fill="var(--secondary)" />
  <text x="970" y="140" text-anchor="middle" class="label">Change Failure</text>
  <text x="970" y="190" text-anchor="middle" class="value">12%</text>
  <path d="M850 230 L1090 230" stroke="var(--text)" stroke-opacity="0.1" stroke-width="2" />
  <text x="970" y="270" text-anchor="middle" class="label">MTTR</text>
  <text x="970" y="315" text-anchor="middle" class="value">15m</text>

  <!-- Roadmap Footer -->
  <rect x="60" y="360" width="1080" height="80" rx="12" fill="var(--secondary)" />
  <text x="80" y="390" class="label" font-size="14">Roadmap: Phase 5 (Scale)</text>
  
  <text x="80" y="420" class="desc" font-weight="700">S5.01: Core Parser</text>
  <text x="340" y="420" class="desc">S5.02: Infra Refine</text>
  <text x="600" y="420" class="desc">S5.03: High Perf</text>
  <text x="860" y="420" class="desc">S5.04: Scale &amp; Clean</text>
  
  <text x="1140" y="480" text-anchor="end" class="desc" font-size="10" opacity="0.3">Rendered via Nano Banana Pro | Pharos Meta-Architecture</text>
</svg>
