# Project: Pharos Kitchen Design (Project Prism)
# Component: CI/CD / Site Deployment
# File: deploy-site.yml
# Author: Richard D. (https://github.com/iamrichardd)
# License: FSL-1.1 (See LICENSE file for details)
# Purpose: Deploys the Astro marketing site to GitHub Pages.
# Traceability: Issue #13, ADR 0004
# ========================================================================

name: "🌐 Deploy Marketing Site"

on:
  push:
    branches:
      - main
    paths:
      - 'apps/marketing/**'
      - 'packages/**'
      - 'scripts/install.sh'
      - 'Containerfile.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BUILD_MODE: ${{ github.ref == 'refs/heads/main' && 'release' || 'debug' }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: "🏗️ Build Site"
    runs-on: ubuntu-latest
    steps:
      - name: "🛒 Checkout Code"
        uses: actions/checkout@v4

      - name: "📦 Cache Build Dependencies"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/Cargo.lock', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: "🔍 Execute Integrated Pulse Validation (Zero-Host)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.cargo/registry ~/.cargo/git ~/.npm
          bash scripts/pulse.sh

      - name: "🏗️ Build Site (Zero-Host)"
        run: |
          podman build -t pkd-ts -f Containerfile.ts \
            --build-arg BUILD_MODE=$BUILD_MODE \
            --volume "$HOME/.npm:/root/.npm:z" .
          # Extract dist folder from the built image (ADR-0016)
          CONTAINER_ID=$(podman create pkd-ts)
          podman cp $CONTAINER_ID:/work/apps/marketing/dist ./apps/marketing/dist
          podman rm $CONTAINER_ID

      - name: "📤 Upload Pages Artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/marketing/dist

  deploy:
    name: "🚀 Deploy to GitHub Pages"
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: "🌐 Deploy"
        id: deployment
        uses: actions/deploy-pages@v4
