# Traceability: Issue #108, Task 4.26.2, Task 4.26.3
# ========================================================================

name: Pulse (Sharded)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write # Required for OIDC AWS Federation
  contents: read

jobs:
  pulse:
    name: Pulse / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        slice: [core, bridge, marketing]
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for TDD traceability checks

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Start CI Watchdog (RET-04)
        run: |
          chmod +x scripts/ci-watchdog.sh
          ./scripts/ci-watchdog.sh &
          echo "WATCHDOG_PID=$!" >> $GITHUB_ENV

      - name: Configure Cloudflare Credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: --version # Initial handshake

      - name: Execute Pulse Slice
        run: bash scripts/pulse.sh --slice ${{ matrix.slice }}
        env:
          BUILD_MODE: ${{ github.ref == 'refs/heads/main' && 'release' || 'debug' }}

      - name: Promote Artifacts (Cloudflare R2)
        if: github.ref == 'refs/heads/main' && matrix.slice == 'core'
        run: |
          echo "🚀 Promoting authoritative WASM core to Cloudflare R2 Registry..."
          # wrangler r2 object put pharos-registry/pkd-core.wasm --file=packages/pkd-core/pkg/pkd_core_bg.wasm
