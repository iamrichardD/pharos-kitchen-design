# License: FSL-1.1
# Purpose: Draft configuration for parallelized CI sharding (Issue #108).
# Why: ADR-0017 (Multi-Stage chaining) ensures cross-language FFI stability.
# Traceability: Issue #108, Task 4.26.2, Task 4.26.3
# ========================================================================

name: Pulse (Sharded)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write # Required for OIDC AWS Federation
  contents: read

jobs:
  pulse:
    name: Pulse / ${{ matrix.slice }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        slice: [core, bridge, marketing]
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for TDD traceability checks

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/mono

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Start CI Watchdog (RET-04)
        run: |
          chmod +x scripts/ci-watchdog.sh
          ./scripts/ci-watchdog.sh &
          echo "WATCHDOG_PID=$!" >> $GITHUB_ENV

      - name: Configure Cloudflare Credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.103.0"
          command: --version # Initial handshake

      - name: Execute Pulse Slice
        run: bash scripts/pulse.sh --slice ${{ matrix.slice }}
        env:
          BUILD_MODE: ${{ github.ref == 'refs/heads/main' && 'release' || 'debug' }}

      - name: Promote Artifacts (Cloudflare R2)
        if: github.ref == 'refs/heads/main' && matrix.slice == 'core'
        run: |
          echo "🚀 Baking authoritative search index..."
          podman run --rm --security-opt seccomp=unconfined -v ${{ github.workspace }}:/work -w /work pkd-core-builder pkd registry bake --source /work/packages/pkd-core/samples --output /work/.artifacts/registry

      - name: Upload Index to Cloudflare R2
        if: github.ref == 'refs/heads/main' && matrix.slice == 'core'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.103.0"
          command: r2 object put pkd-prism-registry/search-index.tar.zst --file=.artifacts/registry/search-index.tar.zst
